spring:
  autoconfigure:
    exclude:
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

  data:
    mongodb:
      uri: mongodb://workload-mongo:27017/workloaddb
      auto-index-creation: true

  activemq:
    broker-url: tcp://workload-activemq:61616
    user: admin
    password: admin

logging:
  file:
    name: /app/logs/application.log