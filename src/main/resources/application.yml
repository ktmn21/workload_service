spring:
  application:
    name: workload-service
  data:
    mongodb:
      auto-index-creation: true
  jms:
    pub-sub-domain: false

workload:
  queue:
    name: workload.queue
    dlq-name: workload.dlq
    max-redeliveries: 3

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: "!standalone"
  data:
    mongodb:
      uri: mongodb://workload-mongo:27017/workloaddb
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
