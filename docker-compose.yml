version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: workload-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: workloaddb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: workload-activemq
    restart: unless-stopped
    ports:
      - "61616:61616"   # OpenWire/JMS port used by spring.activemq.broker-url
      - "8161:8161"     # web console
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin

volumes:
  mongo-data:
